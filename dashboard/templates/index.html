<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- MANDATORY (dark-mode guide): Declare color-scheme before render to prevent FOUC -->
    <meta name="color-scheme" content="dark">
    <title>SDN_ML_QOS // TELEMETRY CONSOLE</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 + Babel CDN (no build step needed for Flask template) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* MANDATORY (dark-mode guide): color-scheme on :root controls viewport-wide native UI theming */
        :root {
            color-scheme: dark;

            /* SECTION: DESIGN_TOKENS — Tier 1: Literal color palette */
            --clr-bg-base:      #09090b;   /* zinc-950 */
            --clr-bg-panel:     #18181b;   /* zinc-900 */
            --clr-bg-cell:      #09090b;   /* zinc-950 */
            --clr-border:       #27272a;   /* zinc-800 */
            --clr-border-faint: #1c1c1f;   /* zinc-850 */

            /* Tier 2: Semantic status colors */
            --clr-ok:      #10b981;   /* emerald-500 */
            --clr-ok-dim:  #064e3b;   /* emerald-950 */
            --clr-warn:    #f59e0b;   /* amber-500 */
            --clr-warn-dim:#451a03;   /* amber-950 */
            --clr-err:     #ef4444;   /* red-500 */
            --clr-err-dim: #450a0a;   /* red-950 */
            --clr-text-1:  #f4f4f5;   /* zinc-100 */
            --clr-text-2:  #a1a1aa;   /* zinc-400 */
            --clr-text-3:  #71717a;   /* zinc-500 */
            --clr-text-4:  #3f3f46;   /* zinc-700 */

            /* Tier 3: scrollbar (scrollbar-color guide) */
            --scrollbar-thumb: #3f3f46;
            --scrollbar-track: var(--clr-bg-base);

            /* scrollbar-color: standard property (Baseline Newly Available) */
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
            scrollbar-width: thin;
        }

        /* Legacy WebKit fallback as required by dark-mode guide */
        @supports not (scrollbar-color: auto) {
            ::-webkit-scrollbar { width: 4px; height: 4px; }
            ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
            ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); }
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--clr-bg-base);
            color: var(--clr-text-2);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
        }

        /* SECTION: BORDER_RADIUS_RESET — Anti-AI-slop: no rounded corners */
        *, *::before, *::after {
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        /* SECTION: TABLE_STYLES — responsive-table guide: sticky thead, container queries */
        .flow-table-wrapper {
            overflow: auto;
            max-inline-size: 100%;
            max-block-size: min(220px, 40vh);
            container-type: inline-size;
            /* responsive-table guide: role+tabindex for keyboard scrollability */
        }

        .flow-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }

        .flow-table thead th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--clr-bg-base);
            color: var(--clr-text-3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 6px;
            border-bottom: 1px solid var(--clr-border);
            white-space: nowrap;
        }

        .flow-table tbody tr { border-bottom: 1px solid var(--clr-border-faint); }
        .flow-table tbody tr:hover { background: var(--clr-bg-panel); }
        .flow-table tbody td { padding: 3px 6px; white-space: nowrap; }

        /* SECTION: BLINK_ANIM — Live indicator */
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .blink { animation: blink 1.4s ease-in-out infinite; }

        /* SECTION: SPARKLINE */
        .sparkline-wrap { width: 100%; height: 100px; background: var(--clr-bg-base); border: 1px solid var(--clr-border-faint); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-400 antialiased">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // SECTION: MOCK_INITIAL_STATE
        const INIT = {
            rtt: 11.4, jitter: 0.92, pktLoss: 0.02,
            peakUtil: 68.5, flowRules: 18, rerouteTime: 1.82,
            ctrlLatency: 1.8, mlLatency: 0.025, mlF1: 99.2,
            mlAUC: 0.989, mlModel: 'RF_BALANCED',
            activePath: 'P1', status: 'NORMAL', scenario: 'K1',
            congRisk: 8.4, deltaU: 2.1
        };

        const PATHS = {
            P1: { label: 'P1 [s1→s2→s6]', bw: '10M', delay: '10ms', hops: 2, links: ['LINK_s1_s2', 'LINK_s2_s6'] },
            P2: { label: 'P2 [s1→s3→s4→s6]', bw: '10M', delay: '30ms', hops: 3, links: ['LINK_s1_s3', 'LINK_s3_s4', 'LINK_s4_s6'] },
            P3: { label: 'P3 [s1→s5→s6]', bw: '5M', delay: '20ms', hops: 2, links: ['LINK_s1_s5', 'LINK_s5_s6'] }
        };

        const SCENARIOS_LIST = [
            { id: 'K1', label: 'K1_NORMAL' },
            { id: 'K2', label: 'K2_RAMP_LOAD' },
            { id: 'K3', label: 'K3_BURST_SPIKE' },
            { id: 'K4', label: 'K4_BOTTLENECK' },
            { id: 'K5', label: 'K5_NETEM_DEGRADE' },
            { id: 'K6', label: 'K6_LINK_FAILURE' },
        ];

        const FLOW_TABLE_INIT = [
            { id: 'FL_01', dpid: 's1', prio: 15, match: '10.0.0.1→10.0.0.2:5001', action: 'OUT:port_2', pkts: 14280, bytes: '18.4M', dur: '48s' },
            { id: 'FL_02', dpid: 's2', prio: 15, match: '10.0.0.1→10.0.0.2:5001', action: 'OUT:port_2', pkts: 14278, bytes: '18.4M', dur: '48s' },
            { id: 'FL_03', dpid: 's6', prio: 15, match: '10.0.0.1→10.0.0.2:5001', action: 'OUT:port_1', pkts: 14278, bytes: '18.4M', dur: '48s' },
            { id: 'FL_04', dpid: 's2', prio: 20, match: '10.0.0.3→10.0.0.4',      action: 'OUT:port_2', pkts: 64120, bytes: '82.0M', dur: '120s' },
            { id: 'FL_05', dpid: 's6', prio: 20, match: '10.0.0.3→10.0.0.4',      action: 'OUT:port_4', pkts: 64120, bytes: '82.0M', dur: '120s' },
            { id: 'FL_06', dpid: 's1', prio: 10, match: '10.0.0.1→10.0.0.2 [BK]', action: 'OUT:port_3', pkts: 120,   bytes: '154K',  dur: '48s' },
            { id: 'FL_07', dpid: 's3', prio: 10, match: '10.0.0.1→10.0.0.2 [BK]', action: 'OUT:port_2', pkts: 120,   bytes: '154K',  dur: '48s' },
            { id: 'FL_08', dpid: 's4', prio: 10, match: '10.0.0.1→10.0.0.2 [BK]', action: 'OUT:port_2', pkts: 120,   bytes: '154K',  dur: '48s' },
            { id: 'FL_09', dpid: 's1', prio: 0,  match: '* (TABLE_MISS)',           action: 'CONTROLLER', pkts: 48,    bytes: '3.2K',  dur: '360s' },
        ];

        const REROUTE_INIT = [
            { id: 1, ts: '14:02:12', type: 'REROUTE',   flow: 'h1→h2', detail: 'P1→P2 | LINK_s2_s6 RISK:94.2% | COST:2.41→1.78 (-26.1%)' },
            { id: 2, ts: '13:58:04', type: 'ANTI_FLAP', flow: 'h1→h2', detail: 'SUPPRESS_OSCILLATION | HOLD_REM:4.2s | ΔCOST:15%' },
            { id: 3, ts: '13:52:20', type: 'ML_ALERT',  flow: 'LINK_s2_s6', detail: 'EARLY_CONGESTION | H:5s | Δu:+4.8%/s | u_mean:78.2%' },
            { id: 4, ts: '13:48:00', type: 'FLOW_MOD',  flow: 'h1→h2', detail: 'INSTALL_BASELINE | PATH:P1 | PRIO:15 | MBB:ACTIVE' }
        ];

        // SECTION: HELPER_COMPONENTS
        const KPICard = ({ label, value, unit, colorVar }) => (
            <div style={{ padding: '10px 12px', borderRight: '1px solid var(--clr-border)' }}>
                <div style={{ fontSize: 10, color: 'var(--clr-text-3)', letterSpacing: '0.08em', fontFamily: 'monospace' }}>{label}</div>
                <div style={{ marginTop: 2, display: 'flex', alignItems: 'baseline', gap: 4 }}>
                    <span style={{ fontSize: 22, fontWeight: 700, color: colorVar || 'var(--clr-text-1)', fontFamily: '"JetBrains Mono", monospace' }}>{value}</span>
                    {unit && <span style={{ fontSize: 10, color: 'var(--clr-text-3)' }}>{unit}</span>}
                </div>
            </div>
        );

        const Tag = ({ label, type = 'neutral' }) => {
            const colors = {
                ok:      { bg: 'var(--clr-ok-dim)',   border: 'var(--clr-ok)',   text: 'var(--clr-ok)' },
                warn:    { bg: 'var(--clr-warn-dim)', border: 'var(--clr-warn)', text: 'var(--clr-warn)' },
                err:     { bg: 'var(--clr-err-dim)',  border: 'var(--clr-err)',  text: 'var(--clr-err)' },
                neutral: { bg: 'var(--clr-bg-base)',  border: 'var(--clr-border)', text: 'var(--clr-text-3)' },
            };
            const c = colors[type] || colors.neutral;
            return (
                <span style={{
                    fontSize: 9, fontWeight: 700, padding: '1px 5px',
                    background: c.bg, border: `1px solid ${c.border}`,
                    color: c.text, fontFamily: 'monospace', letterSpacing: '0.05em'
                }}>{label}</span>
            );
        };

        const UtilBar = ({ pct, h = 4 }) => {
            const color = pct >= 80 ? 'var(--clr-err)' : pct >= 65 ? 'var(--clr-warn)' : 'var(--clr-ok)';
            return (
                <div style={{ width: '100%', height: h, background: 'var(--clr-border-faint)' }}>
                    <div style={{ width: `${pct}%`, height: '100%', background: color, transition: 'width 0.5s ease' }} />
                </div>
            );
        };

        // SECTION: MAIN_DASHBOARD
        function SDNDashboard() {
            const [m, setM] = useState(INIT);
            const [flows, setFlows] = useState(FLOW_TABLE_INIT);
            const [rerouteLog, setRerouteLog] = useState(REROUTE_INIT);
            const [selectedSwitch, setSelectedSwitch] = useState('ALL');
            const [activeScenario, setActiveScenario] = useState('K1');
            const [isLive, setIsLive] = useState(true);
            const [epoch, setEpoch] = useState((Date.now() / 1000).toFixed(1));
            const [consoleLogs, setConsoleLogs] = useState([
                '14:00:01 OFP_EVENT DPID:0001 (s1) PORT_STATUS:UP',
                '14:00:02 OFP_EVENT DPID:0002 (s2) PORT_STATUS:UP',
                '14:00:03 TELEMETRY POLL_CYCLE Δt=1.0s',
                '14:00:04 ML_SERVICE MODEL:RF_BALANCED TREES:100 ONLINE',
                '14:00:05 CONTROLLER ACTIVE_PATH:P1 FLOW_TABLE:COMMITTED',
            ]);
            const [histData, setHistData] = useState(() => {
                const a = [];
                for (let i = 29; i >= 0; i--) {
                    a.push({ tp: (7.2 + Math.sin(i/4)*1.4).toFixed(2), rtt: (11 + Math.cos(i/3)*2).toFixed(1) });
                }
                return a;
            });

            // SECTION: EPOCH_CLOCK
            useEffect(() => {
                const t = setInterval(() => setEpoch((Date.now()/1000).toFixed(1)), 500);
                return () => clearInterval(t);
            }, []);

            // SECTION: TELEMETRY_POLL
            useEffect(() => {
                if (!isLive) return;
                const t = setInterval(() => {
                    fetch('/api/live_data')
                        .then(r => r.json())
                        .then(data => {
                            if (data && data.active_path) {
                                setM(prev => ({
                                    ...prev,
                                    activePath: data.active_path,
                                    scenario: data.current_scenario || prev.scenario,
                                    status: data.system_status === 'CONGESTED_ALERT' ? 'CONGESTED' : 'NORMAL'
                                }));
                            }
                        })
                        .catch(() => {
                            // Fallback: simulate drift when API unavailable
                            setM(prev => {
                                const cong = prev.scenario === 'K4' || prev.scenario === 'K3';
                                const util = cong && prev.activePath === 'P1'
                                    ? 85 + Math.random()*8
                                    : 60 + Math.random()*10;
                                return {
                                    ...prev,
                                    rtt: parseFloat((prev.activePath === 'P1' ? (cong ? 62 : 11.5) : 31).toFixed(1)),
                                    peakUtil: parseFloat(util.toFixed(1)),
                                    jitter: parseFloat((0.6 + Math.random()*0.6).toFixed(2)),
                                    pktLoss: cong && prev.activePath === 'P1' ? parseFloat((3+Math.random()).toFixed(2)) : 0.02,
                                    congRisk: cong ? 90 + Math.random()*8 : 5 + Math.random()*8,
                                    deltaU: cong ? +(3+Math.random()*3).toFixed(1) : +(0.5+Math.random()).toFixed(1),
                                };
                            });
                        });
                    setHistData(prev => {
                        const next = [...prev.slice(1)];
                        next.push({
                            tp: (m.activePath === 'P1' && (m.scenario === 'K4' || m.scenario === 'K3') ? 3.5 : 7.8 + Math.random()*0.5).toFixed(2),
                            rtt: m.rtt.toFixed(1)
                        });
                        return next;
                    });
                }, 1000);
                return () => clearInterval(t);
            }, [isLive, m.activePath, m.scenario, m.rtt]);

            // SECTION: SCENARIO_HANDLER
            const handleScenario = useCallback((scId) => {
                setActiveScenario(scId);
                fetch('/api/scenario/set', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scenario_id: scId })
                }).catch(() => {});
                const ts = new Date().toTimeString().slice(0,8);
                setConsoleLogs(prev => [`${ts} SCENARIO_OVERRIDE ID:${scId}`, ...prev.slice(0,14)]);
                if (scId === 'K4' || scId === 'K3') {
                    setTimeout(() => {
                        setM(prev => ({ ...prev, activePath: 'P2', status: 'REROUTED', congRisk: 94.2 }));
                        setRerouteLog(prev => [{
                            id: Date.now(), ts,
                            type: 'REROUTE', flow: 'h1→h2',
                            detail: `P1→P2 | LINK_s2_s6 CONGESTED | RTT:12ms→30ms | LOSS:0.0%`
                        }, ...prev.slice(0,9)]);
                        setConsoleLogs(prev => [`${ts} ML_REROUTE PATH:P1→P2 T_REROUTE:1.8s`, ...prev.slice(0,14)]);
                    }, 1800);
                } else if (scId === 'K1') {
                    setM(prev => ({ ...prev, activePath: 'P1', status: 'NORMAL', congRisk: 8.4 }));
                }
            }, []);

            const filteredFlows = useMemo(() =>
                selectedSwitch === 'ALL' ? flows : flows.filter(f => f.dpid === selectedSwitch),
            [selectedSwitch, flows]);

            // SECTION: STATUS_COLORS
            const statusColor = m.status === 'NORMAL' ? 'var(--clr-ok)'
                : m.status === 'REROUTED' ? 'var(--clr-warn)'
                : 'var(--clr-err)';
            const pktLossColor = m.pktLoss > 1 ? 'var(--clr-err)' : 'var(--clr-text-1)';
            const utilColor = m.peakUtil >= 80 ? 'var(--clr-err)' : m.peakUtil >= 65 ? 'var(--clr-warn)' : 'var(--clr-text-1)';
            const riskColor = m.congRisk >= 70 ? 'var(--clr-err)' : m.congRisk >= 40 ? 'var(--clr-warn)' : 'var(--clr-ok)';

            const pathInfo = PATHS[m.activePath];
            const utilByPath = {
                P1: m.activePath === 'P1' ? m.peakUtil : 1.2,
                P2: m.activePath === 'P2' ? 84.2 : 0,
                P3: m.activePath === 'P3' ? 76.0 : 0,
            };

            // SECTION: SPARKLINE_RENDER
            const sparkPoints = (key, maxVal, h = 90) =>
                histData.map((d, i) =>
                    `${(i / (histData.length - 1)) * 500},${h - (parseFloat(d[key]) / maxVal) * h}`
                ).join(' ');

            return (
                <div style={{ minHeight: '100vh', background: 'var(--clr-bg-base)', padding: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>

                    {/* SECTION: TOP_NAV */}
                    <header style={{ border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', padding: '6px 12px', display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: 6 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontFamily: 'monospace' }}>
                            <span className="blink" style={{ width: 7, height: 7, background: statusColor, display: 'inline-block' }} />
                            <span style={{ fontWeight: 700, color: 'var(--clr-text-1)', letterSpacing: '0.12em', fontSize: 13 }}>SDN_ML_QOS</span>
                            <span style={{ color: 'var(--clr-text-4)' }}>//</span>
                            <span style={{ fontSize: 11, color: 'var(--clr-text-3)' }}>RYU_4.34 · OF13 · PTIT_N22DCCN012_072</span>
                        </div>

                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'monospace', fontSize: 11 }}>
                            <span style={{ padding: '2px 6px', background: 'var(--clr-bg-base)', border: '1px solid var(--clr-border)', color: 'var(--clr-text-3)' }}>
                                CTRL_RTT: <span style={{ color: 'var(--clr-ok)' }}>{m.ctrlLatency}ms</span>
                            </span>
                            <span style={{ padding: '2px 6px', background: 'var(--clr-bg-base)', border: '1px solid var(--clr-border)', color: 'var(--clr-text-3)' }}>
                                ML_INFER: <span style={{ color: 'var(--clr-warn)' }}>{m.mlLatency}ms</span>
                            </span>
                            <span style={{ padding: '2px 6px', background: 'var(--clr-bg-base)', border: '1px solid var(--clr-border)', color: 'var(--clr-text-3)' }}>
                                EPOCH: <span style={{ color: 'var(--clr-text-2)' }}>{epoch}</span>
                            </span>
                            <button
                                onClick={() => setIsLive(v => !v)}
                                style={{
                                    padding: '2px 8px', fontSize: 10, fontWeight: 700, fontFamily: 'monospace',
                                    border: `1px solid ${isLive ? 'var(--clr-ok)' : 'var(--clr-border)'}`,
                                    background: isLive ? 'var(--clr-ok-dim)' : 'var(--clr-bg-base)',
                                    color: isLive ? 'var(--clr-ok)' : 'var(--clr-text-3)',
                                    cursor: 'pointer', letterSpacing: '0.08em'
                                }}
                            >{isLive ? '⬤ LIVE' : '◼ HALT'}</button>
                        </div>
                    </header>

                    {/* SECTION: KPI_TICKER */}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', borderBottom: 'none' }}>
                        <KPICard label="RTT_AVG" value={m.rtt} unit="ms" />
                        <KPICard label="JITTER" value={m.jitter} unit="ms" />
                        <KPICard label="PKT_LOSS" value={m.pktLoss} unit="%" colorVar={pktLossColor} />
                        <KPICard label="MAX_LINK_UTIL" value={m.peakUtil} unit="%" colorVar={utilColor} />
                        <KPICard label="FLOW_RULES" value={m.flowRules} unit="entries" />
                        <div style={{ padding: '10px 12px' }}>
                            <div style={{ fontSize: 10, color: 'var(--clr-text-3)', letterSpacing: '0.08em', fontFamily: 'monospace' }}>ACTIVE_PATH // T_REROUTE</div>
                            <div style={{ marginTop: 2, display: 'flex', alignItems: 'baseline', gap: 6 }}>
                                <span style={{ fontSize: 22, fontWeight: 700, color: 'var(--clr-ok)', fontFamily: '"JetBrains Mono", monospace' }}>{m.activePath}</span>
                                <span style={{ fontSize: 11, color: 'var(--clr-text-3)' }}>{m.rerouteTime}s</span>
                                <Tag label={m.status} type={m.status === 'NORMAL' ? 'ok' : m.status === 'REROUTED' ? 'warn' : 'err'} />
                            </div>
                        </div>
                    </div>

                    {/* SECTION: WORKSPACE_GRID */}
                    <div style={{ display: 'grid', gridTemplateColumns: '7fr 5fr', gap: 8 }}>

                        {/* SECTION: LEFT_COL */}
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>

                            {/* TOPOLOGY_PANEL */}
                            <div style={{ border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', padding: 10 }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, paddingBottom: 6, borderBottom: '1px solid var(--clr-border)', fontFamily: 'monospace', fontSize: 11 }}>
                                    <span style={{ fontWeight: 700, color: 'var(--clr-text-1)' }}>TOPOLOGY_MATRIX // 6_OVS_NODES</span>
                                    <span style={{ color: 'var(--clr-ok)', padding: '1px 6px', background: 'var(--clr-ok-dim)', border: '1px solid var(--clr-ok)' }}>ROUTE: {m.activePath}</span>
                                </div>

                                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                                    {['P1', 'P2', 'P3'].map(pid => {
                                        const info = PATHS[pid];
                                        const isActive = m.activePath === pid;
                                        const util = utilByPath[pid];
                                        return (
                                            <div key={pid} style={{
                                                padding: 8, border: `1px solid ${isActive ? 'var(--clr-ok)' : 'var(--clr-border-faint)'}`,
                                                background: 'var(--clr-bg-cell)'
                                            }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6, fontFamily: 'monospace', fontSize: 11 }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                                                        {isActive && <span style={{ width: 6, height: 6, background: 'var(--clr-ok)', display: 'inline-block' }} />}
                                                        <span style={{ fontWeight: 700, color: isActive ? 'var(--clr-text-1)' : 'var(--clr-text-3)' }}>{info.label}</span>
                                                    </div>
                                                    <span style={{ fontSize: 10, color: 'var(--clr-text-4)' }}>{info.bw} // {info.delay} // {info.hops}_HOPS</span>
                                                </div>
                                                <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                                                    {info.links.map(lnk => {
                                                        const lUtil = lnk === 'LINK_s2_s6' && pid === 'P1' && isActive ? m.peakUtil : (isActive ? util * 0.95 : 0);
                                                        return (
                                                            <div key={lnk}>
                                                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, marginBottom: 2, fontFamily: 'monospace' }}>
                                                                    <span style={{ color: 'var(--clr-text-3)' }}>{lnk}</span>
                                                                    <span style={{ color: lUtil >= 80 ? 'var(--clr-err)' : lUtil >= 65 ? 'var(--clr-warn)' : 'var(--clr-text-3)' }}>
                                                                        {isActive ? `${lUtil.toFixed(1)}%` : 'IDLE'}
                                                                    </span>
                                                                </div>
                                                                <UtilBar pct={lUtil} h={3} />
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* TELEMETRY_CHART */}
                            <div style={{ border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', padding: 10 }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, paddingBottom: 6, borderBottom: '1px solid var(--clr-border)', fontFamily: 'monospace', fontSize: 11 }}>
                                    <span style={{ fontWeight: 700, color: 'var(--clr-text-1)' }}>TELEMETRY_STREAM // TP vs RTT</span>
                                    <div style={{ display: 'flex', gap: 10, fontSize: 10 }}>
                                        <span style={{ color: 'var(--clr-ok)' }}>■ TP (Mbps)</span>
                                        <span style={{ color: 'var(--clr-warn)' }}>■ RTT (ms)</span>
                                        <span style={{ color: 'var(--clr-err)' }}>— THRESH 8.0M</span>
                                    </div>
                                </div>
                                <div className="sparkline-wrap" style={{ position: 'relative' }}>
                                    <svg width="100%" height="100%" viewBox="0 0 500 90" preserveAspectRatio="none">
                                        {/* Grid lines */}
                                        {[20, 45, 70].map(y => (
                                            <line key={y} x1="0" y1={y} x2="500" y2={y} stroke="#1c1c1f" strokeWidth="0.8" strokeDasharray="2,3" />
                                        ))}
                                        {/* Threshold line 8M */}
                                        <line x1="0" y1="18" x2="500" y2="18" stroke="var(--clr-err)" strokeWidth="0.8" strokeDasharray="4,3" opacity="0.6" />
                                        {/* RTT line */}
                                        <polyline fill="none" stroke="var(--clr-warn)" strokeWidth="1.2"
                                            points={sparkPoints('rtt', 80)} />
                                        {/* TP line */}
                                        <polyline fill="none" stroke="var(--clr-ok)" strokeWidth="1.5"
                                            points={sparkPoints('tp', 10)} />
                                    </svg>
                                    <span style={{ position: 'absolute', top: 3, left: 6, fontSize: 9, color: 'var(--clr-text-4)', fontFamily: 'monospace' }}>10M // 80ms</span>
                                    <span style={{ position: 'absolute', bottom: 3, right: 6, fontSize: 9, color: 'var(--clr-text-4)', fontFamily: 'monospace' }}>W:30s Δt:1s</span>
                                </div>
                            </div>
                        </div>

                        {/* SECTION: RIGHT_COL */}
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>

                            {/* ML_ENGINE_PANEL */}
                            <div style={{ border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', padding: 10, fontFamily: 'monospace' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, paddingBottom: 6, borderBottom: '1px solid var(--clr-border)', fontSize: 11 }}>
                                    <span style={{ fontWeight: 700, color: 'var(--clr-text-1)' }}>ML_ENGINE // EARLY_PREDICTION</span>
                                    <div style={{ display: 'flex', gap: 6 }}>
                                        <Tag label={`F1:${m.mlF1}%`} type="ok" />
                                        <Tag label={`AUC:${m.mlAUC}`} type="ok" />
                                    </div>
                                </div>

                                <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                                    {/* Congestion Risk Bar */}
                                    <div style={{ padding: 7, background: 'var(--clr-bg-cell)', border: '1px solid var(--clr-border-faint)' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, marginBottom: 5 }}>
                                            <span style={{ color: 'var(--clr-text-3)' }}>CONGESTION_RISK_H5s</span>
                                            <span style={{ color: riskColor, fontWeight: 700 }}>{m.congRisk.toFixed(1)}%</span>
                                        </div>
                                        <UtilBar pct={m.congRisk} h={5} />
                                    </div>

                                    {/* ML Metrics Grid */}
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, fontSize: 10 }}>
                                        {[
                                            { label: 'MODEL_TYPE', value: m.mlModel, color: 'var(--clr-ok)' },
                                            { label: 'INFER_LATENCY', value: `${m.mlLatency} ms` },
                                            { label: 'FEAT_Δu', value: `+${m.deltaU}%/s`, color: 'var(--clr-warn)' },
                                            { label: 'u_mean', value: `${m.peakUtil}%` },
                                            { label: 'd_mean', value: `${m.rtt}ms` },
                                            { label: 'HORIZON_H', value: '5.0s' },
                                        ].map(({ label, value, color }) => (
                                            <div key={label} style={{ padding: '5px 7px', background: 'var(--clr-bg-cell)', border: '1px solid var(--clr-border-faint)' }}>
                                                <div style={{ color: 'var(--clr-text-3)', fontSize: 9 }}>{label}</div>
                                                <div style={{ color: color || 'var(--clr-text-1)', fontWeight: 600, marginTop: 2 }}>{value}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* REROUTE_EVENT_LOG */}
                            <div style={{ border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', padding: 10, fontFamily: 'monospace' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, paddingBottom: 6, borderBottom: '1px solid var(--clr-border)', fontSize: 11 }}>
                                    <span style={{ fontWeight: 700, color: 'var(--clr-text-1)' }}>ROUTING_EVENTS // MBB_LOG</span>
                                    <Tag label="ANTI_FLAP:δ15%" type="neutral" />
                                </div>

                                <div style={{ display: 'flex', flexDirection: 'column', gap: 5, maxHeight: 200, overflowY: 'auto' }}>
                                    {rerouteLog.map(log => {
                                        const tagType = log.type === 'REROUTE' ? 'ok' : log.type === 'ANTI_FLAP' ? 'warn' : log.type === 'ML_ALERT' ? 'err' : 'neutral';
                                        return (
                                            <div key={log.id} style={{ padding: '5px 7px', background: 'var(--clr-bg-cell)', border: '1px solid var(--clr-border-faint)', fontSize: 10 }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
                                                    <Tag label={log.type} type={tagType} />
                                                    <span style={{ color: 'var(--clr-text-4)', fontSize: 9 }}>{log.ts}</span>
                                                </div>
                                                <div style={{ color: 'var(--clr-text-2)', lineHeight: 1.4 }}>{log.detail}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* SECTION: BOTTOM_ROW */}
                    <div style={{ display: 'grid', gridTemplateColumns: '8fr 4fr', gap: 8 }}>

                        {/* FLOW_TABLE — responsive-table guide: tabindex, role, aria-label */}
                        <div style={{ border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', padding: 10 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8, paddingBottom: 6, borderBottom: '1px solid var(--clr-border)', fontFamily: 'monospace', fontSize: 11 }}>
                                <span style={{ fontWeight: 700, color: 'var(--clr-text-1)' }}>FLOW_TABLE_OF13</span>
                                <div style={{ display: 'flex', gap: 4, alignItems: 'center', fontSize: 10 }}>
                                    <span style={{ color: 'var(--clr-text-3)' }}>DPID:</span>
                                    {['ALL', 's1', 's2', 's3', 's4', 's6'].map(sw => (
                                        <button key={sw} onClick={() => setSelectedSwitch(sw)} style={{
                                            padding: '1px 6px', fontSize: 10, fontFamily: 'monospace', cursor: 'pointer',
                                            border: `1px solid ${selectedSwitch === sw ? 'var(--clr-ok)' : 'var(--clr-border)'}`,
                                            background: selectedSwitch === sw ? 'var(--clr-ok-dim)' : 'var(--clr-bg-base)',
                                            color: selectedSwitch === sw ? 'var(--clr-ok)' : 'var(--clr-text-3)',
                                        }}>{sw}</button>
                                    ))}
                                </div>
                            </div>

                            {/* responsive-table guide: tabindex="0" + role="region" for keyboard scroll */}
                            <div
                                tabIndex="0"
                                role="region"
                                aria-label="OpenFlow 1.3 Flow Table"
                                className="flow-table-wrapper"
                            >
                                <table className="flow-table">
                                    <thead>
                                        <tr>
                                            {['FLOW_ID','DPID','PRIO','MATCH','ACTION','PKTS','BYTES','DUR'].map(h => (
                                                <th key={h} style={{ textAlign: h === 'PKTS' || h === 'BYTES' || h === 'DUR' ? 'right' : 'left' }}>{h}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredFlows.map(row => (
                                            <tr key={row.id}>
                                                <td style={{ fontWeight: 700, color: 'var(--clr-text-1)' }}>{row.id}</td>
                                                <td style={{ color: 'var(--clr-ok)' }}>{row.dpid}</td>
                                                <td style={{ color: 'var(--clr-text-2)' }}>{row.prio}</td>
                                                <td style={{ color: 'var(--clr-text-2)' }}>{row.match}</td>
                                                <td style={{ color: 'var(--clr-text-1)' }}>{row.action}</td>
                                                <td style={{ textAlign: 'right', color: 'var(--clr-text-3)' }}>{row.pkts.toLocaleString()}</td>
                                                <td style={{ textAlign: 'right', color: 'var(--clr-text-2)' }}>{row.bytes}</td>
                                                <td style={{ textAlign: 'right', color: 'var(--clr-text-3)' }}>{row.dur}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* CONTROLLER_STREAM + SCENARIO_PANEL */}
                        <div style={{ border: '1px solid var(--clr-border)', background: 'var(--clr-bg-panel)', padding: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
                            <div>
                                <div style={{ fontFamily: 'monospace', fontSize: 11, fontWeight: 700, color: 'var(--clr-text-1)', marginBottom: 6, paddingBottom: 6, borderBottom: '1px solid var(--clr-border)', display: 'flex', justifyContent: 'space-between' }}>
                                    <span>CONTROLLER_STREAM</span>
                                    <span style={{ color: 'var(--clr-text-3)', fontWeight: 400 }}>PORT:6653</span>
                                </div>
                                <div
                                    tabIndex="0"
                                    role="region"
                                    aria-label="Controller event stream"
                                    style={{ background: 'var(--clr-bg-cell)', border: '1px solid var(--clr-border-faint)', padding: 6, height: 110, overflowY: 'auto', fontSize: 10, fontFamily: 'monospace' }}
                                >
                                    {consoleLogs.map((log, i) => (
                                        <div key={i} style={{ color: 'var(--clr-text-2)', lineHeight: 1.6, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                            <span style={{ color: 'var(--clr-text-4)' }}>›</span> {log}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <div style={{ fontFamily: 'monospace', fontSize: 10, fontWeight: 700, color: 'var(--clr-text-3)', marginBottom: 5 }}>SCENARIO_PROFILES:</div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 4 }}>
                                    {SCENARIOS_LIST.map(sc => (
                                        <button key={sc.id} onClick={() => handleScenario(sc.id)} style={{
                                            padding: '4px 2px', fontSize: 9, fontFamily: 'monospace', fontWeight: 700,
                                            cursor: 'pointer', textAlign: 'center', letterSpacing: '0.03em',
                                            border: `1px solid ${activeScenario === sc.id ? 'var(--clr-ok)' : 'var(--clr-border)'}`,
                                            background: activeScenario === sc.id ? 'var(--clr-ok-dim)' : 'var(--clr-bg-base)',
                                            color: activeScenario === sc.id ? 'var(--clr-ok)' : 'var(--clr-text-3)',
                                            overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'
                                        }}>{sc.label}</button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<SDNDashboard />);
    </script>
    {% endraw %}
</body>
</html>
